sonar.projectKey=cortexlinux_cortex
sonar.organization=cortexlinux
sonar.projectName=CX Linux

# Exclude dependency/vendor code from analysis
sonar.exclusions=\
  deps/**,\
  vendor/**,\
  wezterm-*/**,\
  termwiz/**,\
  lua-*/**,\
  bidi/**,\
  cairo/**,\
  freetype/**,\
  fontconfig/**,\
  harfbuzz/**,\
  libgit2/**,\
  libpng/**,\
  libssh2/**,\
  openssl/**,\
  pixman/**,\
  zlib/**,\
  zstd/**,\
  **/test/**,\
  **/tests/**,\
  **/*_test.rs,\
  **/*_tests.rs

# Source encoding
sonar.sourceEncoding=UTF-8
